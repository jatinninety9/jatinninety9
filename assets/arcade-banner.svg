      <text x="361" y="317" fill="#c3a5fa">ML / DATA</text>
    </g>
    <text x="49" y="396" fill="#6b849c" font-size="12" letter-spacing="1.8">READ &gt; BUILD &gt; TEST &gt; IMPROVE &gt; REPEAT</text>
  </g>

