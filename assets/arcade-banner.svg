    <text x="48" y="139" fill="#eaf6ff" font-size="53" font-weight="700" letter-spacing="-2">C++ DEVELOPER</text>
    <text x="50" y="181" fill="#41e5d5" font-size="20" letter-spacing="3">BUILD. DEBUG. LEVEL UP.</text>
    <text x="50" y="229" fill="#a2b5ca" font-size="17">Algorithms, useful software,</text>
    <text x="50" y="255" fill="#a2b5ca" font-size="17">and one more problem to solve.</text>

    <g font-size="12" letter-spacing="1">
