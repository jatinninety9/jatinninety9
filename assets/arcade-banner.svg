<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">C++ developer, build, debug, level up</title>
  <desc id="description">A dark technology arcade with a cyan pixel knight, a lime robot companion, and a small purple slime. Player handle: jatinninety9.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#07121f"/>
      <stop offset="1" stop-color="#11102b"/>
    </linearGradient>
    <linearGradient id="platform" x2="1">
      <stop stop-color="#41e5d5"/>
      <stop offset="1" stop-color="#b5f462"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#68a6b8" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#background)"/>
  <rect width="1200" height="440" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="#28404f"/>

